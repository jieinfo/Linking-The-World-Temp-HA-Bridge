name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: |
          python -m py_compile bridge.py test_protocol.py scripts/sync_addon_bridge.py
          find custom_components/linking_the_world_temp_ha -name '*.py' -print0 | xargs -0 python -m py_compile
          if [ -d linking_the_world_temp_ha_bridge_addon ]; then
            python -m py_compile linking_the_world_temp_ha_bridge_addon/bridge.py linking_the_world_temp_ha_bridge_addon/addon_entrypoint.py
          else
            python -m py_compile home_assistant_addon/linking_the_world_temp_ha_bridge_addon/bridge.py home_assistant_addon/linking_the_world_temp_ha_bridge_addon/addon_entrypoint.py
          fi
      - name: Verify generated add-on runtime is in sync
        run: python scripts/sync_addon_bridge.py --check
      - name: Run protocol tests
        run: python -m unittest discover -v
      - name: Validate add-on metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          addon = yaml.safe_load(Path("linking_the_world_temp_ha_bridge_addon/config.yaml").read_text())
          repository = yaml.safe_load(Path("repository.yaml").read_text())
          changelog = Path("linking_the_world_temp_ha_bridge_addon/CHANGELOG.md").read_text()
          assert addon["slug"] == "linking_the_world_temp_ha_bridge"
          assert addon["version"]
          assert repository["name"]
          assert f"## {addon['version']}" in changelog
          PY
      - name: Build Home Assistant add-on image
        run: docker build --build-arg BUILD_ARCH=amd64 linking_the_world_temp_ha_bridge_addon

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run native integration tests
        run: pytest --cov=custom_components/linking_the_world_temp_ha --cov-report=term-missing
